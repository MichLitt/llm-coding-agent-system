tasks:
  - {conversation_id: conv_test_clarify_timezone, split: test, category: clarification-before-action, difficulty: medium, setup_files: [clarify_a/prefs.txt], max_total_steps: 30, verification_contract: {clarification_patterns: {t1: [which, timezone, utc]}, constraint_checks: {empty: [{cmd: 'test ! -s clarify_a/prefs.txt'}], utc: [{cmd: 'grep -qx "timezone=UTC" clarify_a/prefs.txt'}]}}, turns: [{turn_id: t1, user_message: 'Set the report timezone.', intent: clarify missing timezone, expects_clarification: true, introduces_constraints: [empty]}, {turn_id: t2, user_message: 'Use UTC.', intent: apply answer, phase_checks: [{cmd: 'grep -qx "timezone=UTC" clarify_a/prefs.txt'}]}, {turn_id: t3, user_message: 'Keep that as the sole preference.', intent: constrain output, retains_constraints: [utc], phase_checks: [{cmd: 'test "$(wc -l < clarify_a/prefs.txt)" -eq 1'}]}], final_checks: [{cmd: 'grep -qx "timezone=UTC" clarify_a/prefs.txt'}]}
  - {conversation_id: conv_test_clarify_separator, split: test, category: clarification-before-action, difficulty: medium, setup_files: [clarify_b/export.txt], max_total_steps: 30, verification_contract: {clarification_patterns: {t1: [which, separator, comma, tab]}, constraint_checks: {empty: [{cmd: 'test ! -s clarify_b/export.txt'}], tab: [{cmd: 'grep -qx "separator=tab" clarify_b/export.txt'}]}}, turns: [{turn_id: t1, user_message: 'Configure a column separator.', intent: clarify missing separator, expects_clarification: true, introduces_constraints: [empty]}, {turn_id: t2, user_message: 'Use a tab separator.', intent: apply answer, phase_checks: [{cmd: 'grep -qx "separator=tab" clarify_b/export.txt'}]}, {turn_id: t3, user_message: 'Do not add another export option.', intent: constrain output, retains_constraints: [tab], phase_checks: [{cmd: 'test "$(wc -l < clarify_b/export.txt)" -eq 1'}]}], final_checks: [{cmd: 'grep -qx "separator=tab" clarify_b/export.txt'}]}
  - {conversation_id: conv_test_incremental_theme, split: test, category: incremental-requirement, difficulty: medium, setup_files: [increment_a/ui.txt], max_total_steps: 35, verification_contract: {constraint_checks: {keep_title: [{cmd: 'grep -qx "title=Nova" increment_a/ui.txt'}], dark: [{cmd: 'grep -qx "theme=dark" increment_a/ui.txt'}]}}, turns: [{turn_id: t1, user_message: 'Set the UI title to Nova.', intent: base setting, introduces_constraints: [keep_title], phase_checks: [{cmd: 'grep -qx "title=Nova" increment_a/ui.txt'}]}, {turn_id: t2, user_message: 'Add dark theme without changing the title.', intent: incremental change, retains_constraints: [keep_title], introduces_constraints: [dark], phase_checks: [{cmd: 'grep -qx "theme=dark" increment_a/ui.txt'}]}, {turn_id: t3, user_message: 'Alphabetize the keys.', intent: refine representation, retains_constraints: [keep_title, dark], phase_checks: [{cmd: 'test "$(head -1 increment_a/ui.txt)" = "theme=dark"'}]}], final_checks: [{cmd: 'grep -qx "title=Nova" increment_a/ui.txt'}, {cmd: 'grep -qx "theme=dark" increment_a/ui.txt'}]}
  - {conversation_id: conv_test_incremental_retry, split: test, category: incremental-requirement, difficulty: medium, setup_files: [increment_b/worker.txt], max_total_steps: 35, verification_contract: {constraint_checks: {queue: [{cmd: 'grep -qx "queue=jobs" increment_b/worker.txt'}], retries: [{cmd: 'grep -qx "retries=5" increment_b/worker.txt'}]}}, turns: [{turn_id: t1, user_message: 'Configure queue jobs.', intent: base setting, introduces_constraints: [queue], phase_checks: [{cmd: 'grep -qx "queue=jobs" increment_b/worker.txt'}]}, {turn_id: t2, user_message: 'Add five retries and preserve the queue.', intent: add requirement, retains_constraints: [queue], introduces_constraints: [retries], phase_checks: [{cmd: 'grep -qx "retries=5" increment_b/worker.txt'}]}, {turn_id: t3, user_message: 'Use exactly two settings.', intent: scope result, retains_constraints: [queue, retries], phase_checks: [{cmd: 'test "$(wc -l < increment_b/worker.txt)" -eq 2'}]}], final_checks: [{cmd: 'grep -qx "queue=jobs" increment_b/worker.txt'}, {cmd: 'grep -qx "retries=5" increment_b/worker.txt'}]}
  - {conversation_id: conv_test_correction_protocol, split: test, category: user-correction, difficulty: medium, setup_files: [correct_a/net.txt], max_total_steps: 35, verification_contract: {constraint_checks: {version: [{cmd: 'grep -qx "version=2" correct_a/net.txt'}], no_http: [{cmd: '! grep -q "http" correct_a/net.txt'}]}}, turns: [{turn_id: t1, user_message: 'Set protocol=http and version=2.', intent: initial choice, introduces_constraints: [version], phase_checks: [{cmd: 'grep -qx "protocol=http" correct_a/net.txt'}]}, {turn_id: t2, user_message: 'Correction: protocol must be grpc; retain version 2.', intent: replace conflict, retains_constraints: [version], introduces_constraints: [no_http], phase_checks: [{cmd: 'grep -qx "protocol=grpc" correct_a/net.txt'}]}, {turn_id: t3, user_message: 'Keep two keys only.', intent: scope result, retains_constraints: [version, no_http], phase_checks: [{cmd: 'test "$(wc -l < correct_a/net.txt)" -eq 2'}]}], final_checks: [{cmd: 'grep -qx "protocol=grpc" correct_a/net.txt'}, {cmd: 'grep -qx "version=2" correct_a/net.txt'}]}
