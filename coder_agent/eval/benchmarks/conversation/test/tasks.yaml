  - {conversation_id: conv_test_regression_auth, split: test, category: regression-preservation, difficulty: hard, setup_files: [regress_a/auth.txt], max_total_steps: 35, verification_contract: {constraint_checks: {secure: [{cmd: 'grep -qx "secure=yes" regress_a/auth.txt'}], audit: [{cmd: 'grep -qx "audit=on" regress_a/auth.txt'}]}}, turns: [{turn_id: t1, user_message: 'Set secure=yes.', intent: establish guard, introduces_constraints: [secure], phase_checks: [{cmd: 'grep -qx "secure=yes" regress_a/auth.txt'}]}, {turn_id: t2, user_message: 'Enable audit=on while preserving security.', intent: extend safely, retains_constraints: [secure], introduces_constraints: [audit], phase_checks: [{cmd: 'grep -qx "audit=on" regress_a/auth.txt'}]}, {turn_id: t3, user_message: 'Only retain supported flags.', intent: avoid regression, retains_constraints: [secure, audit], phase_checks: [{cmd: '! grep -Ev "^(secure=yes|audit=on)$" regress_a/auth.txt'}]}], final_checks: [{cmd: 'grep -qx "secure=yes" regress_a/auth.txt'}, {cmd: 'grep -qx "audit=on" regress_a/auth.txt'}]}
  - {conversation_id: conv_test_regression_cache, split: test, category: regression-preservation, difficulty: hard, setup_files: [regress_b/cache.txt], max_total_steps: 35, verification_contract: {constraint_checks: {readonly: [{cmd: 'grep -qx "readonly=true" regress_b/cache.txt'}], ttl: [{cmd: 'grep -qx "ttl=60" regress_b/cache.txt'}]}}, turns: [{turn_id: t1, user_message: 'Set readonly=true.', intent: establish invariant, introduces_constraints: [readonly], phase_checks: [{cmd: 'grep -qx "readonly=true" regress_b/cache.txt'}]}, {turn_id: t2, user_message: 'Add ttl=60 without weakening readonly.', intent: add feature, retains_constraints: [readonly], introduces_constraints: [ttl], phase_checks: [{cmd: 'grep -qx "ttl=60" regress_b/cache.txt'}]}, {turn_id: t3, user_message: 'Keep exactly those two options.', intent: preserve invariant, retains_constraints: [readonly, ttl], phase_checks: [{cmd: 'test "$(wc -l < regress_b/cache.txt)" -eq 2'}]}], final_checks: [{cmd: 'grep -qx "readonly=true" regress_b/cache.txt'}, {cmd: 'grep -qx "ttl=60" regress_b/cache.txt'}]}
  - {conversation_id: conv_test_context_alias, split: test, category: contextual-reference, difficulty: medium, setup_files: [context_a/client.txt], max_total_steps: 35, verification_contract: {constraint_checks: {alias: [{cmd: 'grep -qx "alias=primary" context_a/client.txt'}], timeout: [{cmd: 'grep -qx "timeout=9" context_a/client.txt'}]}}, turns: [{turn_id: t1, user_message: 'Configure the client alias as primary.', intent: establish referent, introduces_constraints: [alias], phase_checks: [{cmd: 'grep -qx "alias=primary" context_a/client.txt'}]}, {turn_id: t2, user_message: 'For that client, set timeout to 9.', intent: resolve reference, retains_constraints: [alias], introduces_constraints: [timeout], phase_checks: [{cmd: 'grep -qx "timeout=9" context_a/client.txt'}]}, {turn_id: t3, user_message: 'Keep the earlier alias.', intent: retain referent, retains_constraints: [alias, timeout], phase_checks: [{cmd: 'test "$(wc -l < context_a/client.txt)" -eq 2'}]}], final_checks: [{cmd: 'grep -qx "alias=primary" context_a/client.txt'}, {cmd: 'grep -qx "timeout=9" context_a/client.txt'}]}
  - {conversation_id: conv_test_context_adapter, split: test, category: contextual-reference, difficulty: medium, setup_files: [context_b/adapter.txt], max_total_steps: 35, verification_contract: {constraint_checks: {kind: [{cmd: 'grep -qx "kind=sync" context_b/adapter.txt'}], batch: [{cmd: 'grep -qx "batch=8" context_b/adapter.txt'}]}}, turns: [{turn_id: t1, user_message: 'Create a sync adapter.', intent: establish referenced adapter, introduces_constraints: [kind], phase_checks: [{cmd: 'grep -qx "kind=sync" context_b/adapter.txt'}]}, {turn_id: t2, user_message: 'Give the previous adapter batch size 8.', intent: resolve previous reference, retains_constraints: [kind], introduces_constraints: [batch], phase_checks: [{cmd: 'grep -qx "batch=8" context_b/adapter.txt'}]}, {turn_id: t3, user_message: 'Do not turn it async.', intent: preserve context, retains_constraints: [kind, batch], phase_checks: [{cmd: '! grep -q "async" context_b/adapter.txt'}]}], final_checks: [{cmd: 'grep -qx "kind=sync" context_b/adapter.txt'}, {cmd: 'grep -qx "batch=8" context_b/adapter.txt'}]}
  - {conversation_id: conv_test_scope_fixture, split: test, category: scope-and-constraint-control, difficulty: hard, setup_files: [scope_a/app.txt, scope_a/protected.txt], max_total_steps: 40, verification_contract: {constraint_checks: {protected: [{cmd: 'grep -qx "PROTECTED" scope_a/protected.txt'}], feature: [{cmd: 'grep -qx "feature=beta" scope_a/app.txt'}]}}, turns: [{turn_id: t1, user_message: 'Do not edit protected.txt; add feature=beta.', intent: scope guard, introduces_constraints: [protected, feature], phase_checks: [{cmd: 'grep -qx "feature=beta" scope_a/app.txt'}]}, {turn_id: t2, user_message: 'Add mode=stable without touching protected.txt.', intent: incremental scoped edit, retains_constraints: [protected, feature], phase_checks: [{cmd: 'grep -qx "mode=stable" scope_a/app.txt'}]}, {turn_id: t3, user_message: 'Keep only feature and mode in app.', intent: scope limit, retains_constraints: [protected, feature], phase_checks: [{cmd: 'test "$(wc -l < scope_a/app.txt)" -eq 2'}]}], final_checks: [{cmd: 'grep -qx "PROTECTED" scope_a/protected.txt'}, {cmd: 'grep -qx "feature=beta" scope_a/app.txt'}, {cmd: 'grep -qx "mode=stable" scope_a/app.txt'}]}
