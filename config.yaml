model:
  provider: minimax
  name: MiniMax-M2.7
  api_format: anthropic    # "openai" for M2.5, "anthropic" for M2.7
  temperature: 0.2
  max_tokens: 8192
  seed: 42

# Named LLM profiles — preferred over the legacy model: block above.
# Each profile declares transport (openai|anthropic), model name, and env var
# names for API key and base URL.  Set llm.default_profile to choose which
# profile is used when --llm-profile is not specified on the CLI.
llm:
  default_profile: minimax_m27

  profiles:
    minimax_m27:
      transport: anthropic
      model: MiniMax-M2.7
      api_key_env: LLM_MINIMAX_M27_API_KEY
      base_url_env: LLM_MINIMAX_M27_BASE_URL
      base_url_default: https://api.minimax.io/anthropic

    minimax_m25:
      transport: openai
      model: MiniMax-M2.5
      api_key_env: LLM_MINIMAX_M25_API_KEY
      base_url_env: LLM_MINIMAX_M25_BASE_URL

    glm_5:
      transport: openai
      model: glm-5.1
      api_key_env: LLM_GLM_5_API_KEY
      base_url_env: LLM_GLM_5_BASE_URL
      base_url_default: https://api.z.ai/api/coding/paas/v4
      # Optional, enables estimated_cost_usd. Fill in from the provider's
      # current price sheet; values are USD per million tokens.
      # pricing:
      #   input_usd_per_mtok: 0.0
      #   output_usd_per_mtok: 0.0
      #   cached_input_usd_per_mtok: 0.0

    # glm_5 with thinking off. GLM-5.1 reasoning counts against max_tokens
    # and can use the whole budget without producing output
    # (report/EVAL_INTEGRITY_AUDIT_v0.8.0.md, Finding 3).
    glm_5_nothink:
      transport: openai
      model: glm-5.1
      api_key_env: LLM_GLM_5_API_KEY
      base_url_env: LLM_GLM_5_BASE_URL
      base_url_default: https://api.z.ai/api/coding/paas/v4
      extra_body:
        thinking:
          type: disabled

    # DeepSeek V4.1 Flash with thinking off, as glm_5_nothink. Thinking is
    # DeepSeek's default, and with tools it requires every later request to
    # send back the reasoning_content, which this client does not keep.
    deepseek_flash_nothink:
      transport: openai
      model: deepseek-flash
      api_key_env: LLM_DEEPSEEK_API_KEY
      base_url_env: LLM_DEEPSEEK_BASE_URL
      base_url_default: https://api.deepseek.com
      extra_body:
        thinking:
          type: disabled

agent:
  max_steps: 15
  max_retries: 3
  planning_mode: react
  enable_memory: false     # `C4` enables project memory for multi-step tasks
  enable_checklist: false  # `C5` remains experimental/non-promoted in the 0.6.x -> 0.7.0 cycle
  enable_run_state: true
  enable_approach_memory: true
  memory_lookup_mode: recency
  doom_loop_threshold: 2
  run_state_db_path: memory/run_state.db

tools:
  terminal_timeout: 30
  # MCP stays disabled unless an explicit local stdio server is listed here.
  # Each entry declares id, command, args, workdir (optional), tool_allowlist,
  # timeout_seconds, and env_allowlist.  Secrets are forwarded only when their
  # environment-variable names are listed in env_allowlist.
  mcp_servers: []
  # Tool-call permission policy (coder_agent/tools/policy.py). "legacy" keeps the
  # substring denylist below as the only check; "workspace-write" and
  # "read-only" enforce structural rules and fail closed without an approver.
  policy_mode: legacy
  # Remove API keys, tokens and other secret-named variables from the
  # environment of Agent shell commands. Independent of policy_mode.
  scrub_secret_env: true
  blocked_commands:
    - "rm -rf /"
    - "sudo"
    - ":(){:|:&};:"
    - "/dev/sda"
    - "mkfs"
    - "dd if="
    - "chmod -R 777 /"

context:
  max_tokens: 8000
  summary_threshold: 6000
  compression_strategy: rule_based  # rule_based / disabled
  observation_compression_mode: "off"
  history_compaction_mode: "rule_based"
  history_compaction_message_threshold: 20
  keep_recent_turns: 6

eval:
  output_dir: results/
  trajectory_dir: trajectories/
  random_seed: 42

service:
  host: 127.0.0.1
  port: 8000
  max_concurrent_runs: 4
